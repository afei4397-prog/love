<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <title>送给我最爱的你 ❤️</title>

    <style>
        body {
            margin: 0;
            padding: 0;

            background-image: url("background.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            text-align: center;
            font-family: "Microsoft YaHei", sans-serif;
            min-height: 100vh;
        }

        h1 {
            margin-top: 30px;
            color: #ff2d55;
            font-size: 55px;
        }

        p {
            font-size: 28px;
            color: #333;
        }

        button {

            margin-top: 40px;

            padding: 15px 40px;

            font-size: 24px;

            border: none;

            border-radius: 12px;

            background: #ff2d55;

            color: white;

            cursor: pointer;

        }

        .photo {
            width: 260px;
            height: 260px;
            object-fit: cover;
            border-radius: 50%;
            border: 8px solid white;
            box-shadow: 0 0 30px rgba(255, 255, 255, .8);
            margin-top: 40px;
            animation: photoMove 3s infinite;
        }

        @keyframes photoMove {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .heart {
            position: fixed;
            top: -30px;
            color: #ff2d55;
            font-size: 24px;
            pointer-events: none;
            z-index: 999;
            animation: fall linear forwards;
        }

        @keyframes fall {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            to {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
    </style>

</head>

<body>
    <img src="photo.jpg" class="photo" alt="我们的合照">

    <h1>❤️ 送给我最爱的你 ❤️</h1>

    <p>谢谢你的出现。</p>

    <p>遇见你，是我最幸运的事情。</p>

    <p>希望未来的每一天，都有我陪着你。❤️</p>

    <button onclick="love()">

        点我一下 ❤️

    </button>

    <script>

        function love() {

            alert("❤️ 我会一直陪着你 ❤️");

        }
        function createHeart() {
            const heart = document.createElement("div");

            heart.className = "heart";
            heart.innerHTML = "❤️";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (Math.random() * 20 + 16) + "px";
            heart.style.animationDuration = (Math.random() * 3 + 4) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        setInterval(createHeart, 400);
        const letter = `亲爱的宝宝 ❤️

谢谢你来到我的世界。

遇见你，是我这一生最幸运的事情。

以后的每一天，
我都会一直陪着你。

开心的时候，
我陪你笑。

难过的时候，
我陪着你。

未来很长，
希望身边的人一直都是你。

我爱你 ❤️`;

        let letterIndex = 0;

        function typeWriter() {
            const letterBox = document.getElementById("letter");

            if (letterIndex < letter.length) {
                letterBox.textContent += letter.charAt(letterIndex);
                letterIndex++;

                setTimeout(typeWriter, 80);
            }
        }

        window.addEventListener("load", typeWriter);
    </script>

</body>

</html>
